interface:
  display_name: "Autonomous-Schematic-Generation (ASG)"
  short_description: "ASG: requirements to verified, readable KiCad schematics"
  default_prompt: "Use $autonomous-schematic-generation to turn confirmed requirements into a board electrical intent, draw readable KiCad pages with pin-geometry recipes and outline rules O1-O8, and verify native ERC, pin-by-pin nets against the intent, hierarchy, symbols, readability, geometry and rendered pages; hand strict review to schematic-review."
